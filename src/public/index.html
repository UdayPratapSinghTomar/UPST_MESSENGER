<!DOCTYPE html>
<html>
<head>
  <title>Room Based Chat Test</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: auto; }
    input, button { width: 100%; margin: 5px 0; padding: 8px; }
    ul { background: #f4f4f4; min-height: 150px; padding: 10px; list-style: none; }
    .msg { margin: 5px 0; padding: 6px; border-radius: 6px; max-width: 70%; }
    .me { background: #d1ffd6; margin-left: auto; text-align: right; }
    .other { background: #fff; }
    .online { color: green; font-weight: bold; }
  </style>
</head>
<body>

<h2>Realtime Chat (Join by Chat ID)</h2>

<input id="token" placeholder="JWT Token">
<!-- <input id="userId" type="number" placeholder="Your User ID"> -->
<button onclick="connectSocket()">Connect</button>
<div id="status"></div>

<hr>

<input id="chatIdInput" type="number" placeholder="Enter Chat ID to Join">
<button onclick="joinChat()">Join Chat</button>

<h3>Messages</h3>
<ul id="messages"></ul>

<input id="messageInput" placeholder="Type message">
<button onclick="sendMessage()">Send</button>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
let socket = null;
let currentUserId = null;
let activeChatId = null;
let tokenGlobal = null;

const EVENTS = {
  JOIN_CHAT: "join_chat",
  JOINED_CHAT: "joined_chat",
  NEW_MESSAGE: "new_message",
  SOCKET_ERROR: "socket_error"
};

/* ================= CONNECT ================= */
function connectSocket() {
  tokenGlobal = document.getElementById("token").value.trim();

  if (!tokenGlobal) {
    alert("Please enter JWT token");
    return;
  }

  socket = io("http://localhost:3000", { auth: { token: tokenGlobal } });

  socket.on("connect", () => {
    console.log("Socket connected:", socket.id);
    document.getElementById("status").innerHTML =
      `<span class="online">ONLINE</span>`;

    // Extract user id from JWT
    const payload = JSON.parse(atob(tokenGlobal.split(".")[1]));
    currentUserId = payload.id;
    console.log("Current user:", currentUserId);
  });

  socket.on(EVENTS.JOINED_CHAT, (data) => {
    console.log("Joined chat confirmed:", data);
  });

  // ✅ REALTIME MESSAGE LISTENER (ONLY ONCE HERE)
  socket.on(EVENTS.NEW_MESSAGE, (data) => {
    console.log("Received new_message:", data);

    if (String(data.chat_id) === String(activeChatId)) {
      addMessage(data);
    }
  });

  socket.on(EVENTS.SOCKET_ERROR, (err) => {
    console.error("Socket error:", err);
    alert(err.message || "Socket error");
  });

  socket.on("disconnect", () => {
    document.getElementById("status").innerHTML =
      `<span style="color:red;">DISCONNECTED</span>`;
  });
}

/* ================= JOIN CHAT ================= */
function joinChat() {
  if (!socket || !socket.connected) {
    alert("Connect socket first");
    return;
  }

  const chatId = Number(document.getElementById("chatIdInput").value);

  if (!chatId) {
    alert("Enter valid chat ID");
    return;
  }

  activeChatId = chatId;

  console.log("Emitting join_chat:", chatId);
  socket.emit(EVENTS.JOIN_CHAT, chatId);

  document.getElementById("messages").innerHTML = "";
}

/* ================= SEND MESSAGE ================= */
async function sendMessage() {
  if (!activeChatId) {
    alert("Join a chat first");
    return;
  }

  const content = document.getElementById("messageInput").value.trim();

  if (!content) {
    alert("Please type a message");
    return;
  }

  try {
    await fetch("http://localhost:3000/message/send", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + tokenGlobal
      },
      body: JSON.stringify({
        chat_id: activeChatId,
        content
      })
    });

    document.getElementById("messageInput").value = "";

  } catch (err) {
    alert("Error sending message: " + err.message);
  }
}

/* ================= ADD MESSAGE ================= */
function addMessage(data) {
  const list = document.getElementById("messages");

  const li = document.createElement("li");
  li.classList.add("msg");

  if (data.sender_id === currentUserId) {
    li.classList.add("me");
  } else {
    li.classList.add("other");
  }

  li.innerText = data.content || "(no content)";
  list.appendChild(li);

  list.scrollTop = list.scrollHeight;
}
</script>

</body>
</html>
